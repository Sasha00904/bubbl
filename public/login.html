<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вход — Bubbl</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2365C466'/%3E%3Cpath d='M46 31c0 7.7-6.7 14-15 14-2.5 0-4.9-.6-7-1.6L16 46l2.4-7.2C16.9 36.6 16 33.9 16 31c0-7.7 6.7-14 15-14s15 6.3 15 14z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/auth.css">
  <link rel="stylesheet" href="/mobile.css">
</head>
<body class="auth-page">
  <div class="profile-style-wrapper">
    <h1 class="profile-style-heading">Добро пожаловать в Bubbl</h1>

    <div class="profile-style-card" style="max-width: 340px;">
      <form class="bubbl-form" id="loginForm">
        <div class="profile-ios-group">
          <div class="profile-ios-row">
            <span class="profile-ios-label">Логин</span>
            <input type="text" id="loginInput" autocomplete="username" required>
          </div>

          <div class="profile-ios-row">
            <span class="profile-ios-label">Пароль</span>
            <input type="password" id="passwordInput" autocomplete="current-password" required>
          </div>
        </div>

        <button type="submit" class="profile-style-btn">Войти</button>
        <div class="bubbl-error" id="errorMsg"></div>
      </form>
    </div>

    <a href="/register.html" class="profile-bottom-link">Создать аккаунт</a>
  </div>

  <div class="bubbl-footer-copyright">BubildaProjects.co</div>

  <script>
    if (localStorage.getItem('currentUser')) {
      window.location.href = '/chat.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const errEl = document.getElementById('errorMsg');
      errEl.textContent = '';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.error || 'Неверный логин или пароль';
          return;
        }

        localStorage.setItem('currentUser', JSON.stringify(data.user));
        window.location.href = '/chat.html';
      } catch (err) {
        errEl.textContent = 'Не удалось подключиться к серверу';
      }
    });
  </script>
</body>
</html>
